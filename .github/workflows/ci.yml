name: tests

# The whole point of this project is that two independent implementations agree
# byte for byte. Changing one of them alone is the mistake most likely to slip
# through, so every push runs both engines and then runs them against each other.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the full suite
        run: ./tests/run_all.sh
        env:
          PYTHON: python3
          NODE: node
